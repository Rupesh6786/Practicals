<html>
    <head>
        <title>Personal Details</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <center>
        <form action="Prac4b.jsp" method="post">
            <h2>Personal Details</h2>

            <input type="radio" name="gender" value="female">Female
            <input type="radio" name="gender" value="other">Other
            <br><br>
            Hobbies:
            <input type="checkbox" name="hobibes">Football
            <input type="checkbox" name="hobbies">Cricket
            <input type="checkbox" name="hobbies">Book-Reading<br><br>
            Email: <input type="email" name="email" placeholder="enter your email"><br><br>
            
            <input type="submit" value="SUBMIT"><br><br>
            <input type="hidden" name="error">
        </form>
        </center>
    </body>
</html>
