<html>
    <head>
        <title>Practical 1A</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <form action="Prac1aServlet" method="get">
            <h3>Calcuate</h3><br><br>
            Enter 1st no: <input type="number" name="n1"><br><br>
            
            Enter 2nd no: <input type="number" name="n2"><br><br>
            
            Select the oprator:<br>
            <input type="radio" name="opr" value="+">Addition
            <input type="radio" name="opr" value="-">Subtraction
            <input type="radio" name="opr" value="*">Multiplication
            <input type="radio" name="opr" value="/">Division
            <input type="radio" name="opr" value="%">Modulus<br><br>
            
            <input type="submit" value="Calculate"> 
        </form>
    </body>
</html>
